name: Build kernel (A15/A16)

on:
  push:
    branches: [ 'work/a15-build' ]
  pull_request:
    branches: [ 'work/a15-build' ]

jobs:
  build:
    name: Build (begonia_user_defconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc build-essential flex bison libncurses-dev libssl-dev device-tree-compiler

      - name: Show tool versions
        run: |
          clang --version || true
          aarch64-linux-gnu-gcc --version || true

      - name: Build kernel (nova-build.sh)
        run: |
          chmod +x ./nova-build.sh
          ./nova-build.sh -b

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kernel-artifacts
          path: |
            *.zip
            out/**
